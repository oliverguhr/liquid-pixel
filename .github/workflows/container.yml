name: Build and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Test model and server
        run: |
          npm ci
          npm test -- --runInBand
          docker compose config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image for smoke check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: liquid-pixel:smoke
          cache-from: type=gha

      - name: Check HTTP assets, health check and WebSocket in container
        run: |
          docker run --detach --name liquid-pixel-smoke \
            --health-interval=1s --publish 127.0.0.1:4173:4173 liquid-pixel:smoke
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' liquid-pixel-smoke)" = healthy ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' liquid-pixel-smoke)" = healthy
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { WebSocket } = require('ws');
          (async () => {
            const base = 'http://127.0.0.1:4173';
            const response = await fetch(base);
            assert.equal(response.status, 200);
            const html = await response.text();
            const assets = [...html.matchAll(/(?:src|href)="([^"#]+\.(?:js|css))"/g)].map(match => match[1]);
            assert(assets.includes('node_modules/p5/lib/p5.min.js'));
            for (const asset of ['/playground', ...assets]) {
              assert.equal((await fetch(new URL(asset, base))).status, 200, asset);
            }
            await new Promise((resolve, reject) => {
              const socket = new WebSocket(base.replace('http:', 'ws:') + '/socket', { origin: base });
              const timeout = setTimeout(() => socket.terminate(), 5000);
              socket.on('error', reject);
              socket.once('close', () => { clearTimeout(timeout); reject(new Error('Closed before hello')); });
              socket.on('message', data => {
                if (JSON.parse(data).type !== 'hello') return;
                clearTimeout(timeout);
                socket.close();
                resolve();
              });
            });
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs liquid-pixel-smoke || true
          docker rm --force liquid-pixel-smoke || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Publish AMD64 and ARM64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
